name: CI quality checks

# This starter already runs on StaticAnalysis. Push it first and inspect the
# successful Build job before completing the remaining TODOs.
on:
  workflow_dispatch:
  push:
    branches:
      - StaticAnalysis
      - main
      - Dev
  pull_request:
    branches:
      - StaticAnalysis
      - main
      - Dev

# The workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # `assemble` compiles and packages the project without running verification tasks.
      - name: Compile and assemble
        run: ./gradlew assemble

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Jobs use separate runners, so this job cannot reuse the build job's files.

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: warn
      # Apply if: always() so a failed test job still uploads its report.

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      - name: Run SpotBugs
        if: always()
        run: ./gradlew spotbugsMain -PstaticAnalysis=true
      #   ./gradlew checkstyleMain
      #   ./gradlew spotbugsMain -PstaticAnalysis=true
      # Apply if: always() to the SpotBugs step so it still runs and produces a
      # report when Checkstyle finds enough remaining violations to fail its step.
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            build/reports/checkstyle/
            build/reports/spotbugs/
          if-no-files-found: warn
      # with actions/upload-artifact@v4. Apply if: always(), choose a distinct
      # artifact name, and use if-no-files-found: warn. Remove the placeholder
      # step after completing this job.
